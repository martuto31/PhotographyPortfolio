<!-- K3 from the 2026-09 canvas: the form is the page. Heading centred, the form
     under it at reading width, the other ways to write as one quiet line. -->
<header class="page-heading">
    <span class="eyebrow eyebrow-center">Контакти</span>

    <h1>Нека се чуем</h1>

    <p class="lead-sans">Изпратете ми датата, мястото и повода. Ще ви отговоря дали датата е свободна и ще ви изпратя конкретна оферта.</p>
</header>

<div class="form-column">
    <app-contact-me [embedded]="true" [showHeading]="false"></app-contact-me>
</div>

<nav class="ways" aria-label="Други начини за връзка">
    <a class="way" [href]="contact.messengerHref" target="_blank" rel="noopener">
        <span class="way-label">Messenger</span>
        <span class="way-value">Пишете ми</span>
    </a>

    <a class="way" [href]="contact.instagramDmHref" target="_blank" rel="noopener">
        <span class="way-label">Instagram</span>
        <span class="way-value">{{ contact.instagramHandle }}</span>
    </a>

    <a class="way" [href]="contact.emailHref">
        <span class="way-label">Имейл</span>
        <span class="way-value">{{ contact.email }}</span>
    </a>

    <div class="way way-static">
        <span class="way-label">Къде снимам</span>
        <span class="way-value">София &amp; Видин</span>
    </div>
</nav>
