<div class="bar">
    <div class="bar-inner">
        <a routerLink="" class="brand" aria-label="Начало — Виктория Борисова">
            <span class="brand-name">Victoria Borisova</span>
            <span class="brand-tag">Photography</span>
        </a>

        <button class="menu-btn" type="button" (click)="toggleMenu()" aria-label="Меню" [attr.aria-expanded]="isExpanderOpen">
            <span class="menu-lines" aria-hidden="true"><i></i><i></i></span>
        </button>
    </div>
</div>

@if (isExpanderOpen) {
    <div class="expander-container" [@slideInOut]>
        <div class="expander">
            <div class="heading">
                <a routerLink="" class="brand" (click)="closeMenu()" aria-label="Начало">
                    <span class="brand-name">Victoria Borisova</span>
                    <span class="brand-tag">Photography</span>
                </a>

                <button class="menu-btn" type="button" (click)="toggleMenu()" aria-label="Затвори">
                    <span class="menu-lines is-close" aria-hidden="true"><i></i><i></i></span>
                </button>
            </div>

            <nav class="actions" aria-label="Основна навигация">
                <a routerLink="/galerii" (click)="closeMenu()">Галерия</a>
                <a routerLink="/about-me" (click)="closeMenu()">За мен</a>
                <a routerLink="/kontakti" (click)="closeMenu()">Контакти</a>
            </nav>

            <div class="menu-contact">
                <a class="menu-primary" [href]="contact.messengerHref" target="_blank" rel="noopener">Пишете в Messenger</a>
                <a class="menu-primary" [href]="contact.instagramDmHref" target="_blank" rel="noopener">Пишете в Instagram</a>
                <a class="menu-email" [href]="contact.emailHref">{{ contact.email }}</a>

                <div class="links">
                    <a [href]="contact.facebook" target="_blank" rel="noopener" aria-label="Facebook"><img src="assets/img/facebook.svg" alt=""></a>
                    <a [href]="contact.instagram" target="_blank" rel="noopener" aria-label="Instagram"><img src="assets/img/instagram.svg" alt=""></a>
                </div>
            </div>
        </div>
    </div>
}
