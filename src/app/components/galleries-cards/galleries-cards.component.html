<div class="container">
    @if (pageHeading) {
        <header class="page-heading">
            <h1>{{ pageHeading }}</h1>

            @if (pageSubheading) {
                <p>{{ pageSubheading }}</p>
            }
        </header>
    }

    <div class="cards-container">
        @for (gallery of currentGalleries; track $index) {
            <div class="card" [routerLink]="[ '/galeriya', gallerySlug + '/' + gallery.name ]">
                <div class="image-wrap">
                    <img class="lazy-load"
                        [src]="gallery.imageSrc"
                        [width]="dimensionsService.isDesktop ? '650' : '350'"
                        [height]="dimensionsService.isDesktop ? '450' : '250'"
                        (load)="onImageLoad(gallery)"
                        [class.loaded]="gallery.isImgLoaded"
                        [alt]="altPrefix + gallery.name + ' — фотограф София и Видин'"
                    >

                    @if (!gallery.isImgLoaded) {
                        <div class="skeleton"></div>
                    }
                </div>

                <div class="card-meta">
                    <span class="tag">{{ cardTag }}</span>

                    <h3>{{ gallery.name }}</h3>
                </div>
            </div>
        }
    </div>
</div>
