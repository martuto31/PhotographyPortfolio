<section id="projects" class="container">
    <header class="section-heading">
        <span class="eyebrow">Портфолио</span>

        <h2>Галерия — <em>сватби, абитуриенти,<br>лични фотосесии</em></h2>
    </header>

    @for (project of projects; track $index) {
        <article class="project" [class.reverse]="$index % 2 !== 0">
            <a class="project-image-link" [routerLink]="project.btnLink" [attr.aria-label]="project.name">
                <img [src]="project.imageSrc" [alt]="project.name + ' — фотограф София и Видин'" loading="lazy">
            </a>

            <div class="project-summary">
                <span class="eyebrow">{{ project.tag }}</span>

                <h3>{{ project.name }}</h3>

                <p>{{ project.summary }}</p>

                <a [routerLink]="project.btnLink" class="link-underline">Към галерията</a>
            </div>
        </article>
    }
</section>
