<section id="projects">
    <header class="section-heading">
        <div class="section-title">
            <span class="eyebrow">Портфолио</span>

            <h2>Галерия - <em>сватби, абитуриенти, други събития</em></h2>
        </div>

        <a routerLink="/galerii" class="link-underline all-galleries">Всички категории</a>
    </header>

    <!-- P1 from the 2026-09 canvas: three cards, the same object as a card on
         /galerii, so the flow is one step - card → category → gallery. -->
    <div class="cards">
        @for (project of projects; track project.btnLink) {
            <a class="card" [routerLink]="project.btnLink">
                <img class="card-image glow" [src]="project.imageSrc" [alt]="project.name + ' - Виктория Борисова'" width="800" height="1000" loading="lazy" decoding="async">

                <span class="card-meta">
                    <span class="card-tag">{{ project.tag }}</span>

                    <h3>{{ project.name }}</h3>
                </span>
            </a>
        }
    </div>
</section>
