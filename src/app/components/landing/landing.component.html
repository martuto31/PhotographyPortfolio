<app-intro-section></app-intro-section>

<app-credentials></app-credentials>

<div class="section-space"></div>

<!-- Not deferred: this section holds the only internal links to the /galerii/*
     category pages, and @defer blocks are skipped during prerender (crawlers
     would see none). -->
<app-projects></app-projects>

<div class="section-space"></div>

<app-process></app-process>

<div class="section-space"></div>

<!-- Q3 from the 2026-09 canvas: the photograph whole, the words beside it on
     a band - the same move as the hero. Decorative, so hidden from readers. -->
<section class="quote bleed" aria-hidden="true">
    <img class="quote-photo" src="assets/img/hero/feature-love.webp" alt="" width="5568" height="3712" loading="lazy" decoding="async">

    <div class="quote-band">
        <span class="quote-rule"></span>
        <p><em>"Истории, които остават."</em></p>
        <span class="quote-name">Виктория Борисова</span>
    </div>
</section>

@if (hasTestimonials) {
    <div class="section-space"></div>

    <app-testimonials></app-testimonials>
}

<div class="section-space"></div>

<app-faq [items]="faq"></app-faq>

<div class="section-space"></div>

<app-cta-band
    heading="Разкажете ми за вашия ден"
    text="Пишете ми датата и мястото на събитието - отговарям до 24 часа с наличност и цена.">
</app-cta-band>
