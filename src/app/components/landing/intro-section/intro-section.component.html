<section class="hero">
    <!-- The print hung in a dark room: inset from the edges and lit from behind.
         The glow is a sibling of the print, not a child, so the clipped image
         cannot swallow its shadow. -->
    <div class="hero-glow" aria-hidden="true"></div>

    <div class="hero-print">
    <div class="hero-image" aria-hidden="true"></div>

    <div class="hero-overlay">
        <div class="hero-inner">
            <span class="hero-kicker">Виктория Борисова - phbyviki</span>

            <h1>Сватбен и <em>събитиен фотограф</em><br>в София и Видин</h1>

            <p class="hero-sub">Заснемам вашите събития в цялата страна. Без позиране и напрежение - вие преживявате деня си, а аз го запечатвам.</p>

            <div class="btn-group">
                <a routerLink="/galerii" class="btn btn-light">Разгледайте галерията</a>

                <a [href]="contact.messengerHref" target="_blank" rel="noopener" class="btn btn-ghost-light call-btn">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 2C6.3 2 2 6.2 2 11.8c0 3.1 1.4 5.8 3.7 7.6V23l3.4-1.9c.9.25 1.9.4 2.9.4 5.7 0 10-4.2 10-9.7S17.7 2 12 2Zm1 13.1-2.6-2.7-5 2.7L11 9.2l2.6 2.7 4.9-2.7-6.5 6.9Z"/>
                    </svg>
                    Пишете ми
                </a>
            </div>
        </div>
    </div>

    <button type="button" class="scroll-cue" (click)="scrollToWork()" aria-label="Към работите">
        <span class="scroll-line" aria-hidden="true"></span>
    </button>
    </div>
</section>
