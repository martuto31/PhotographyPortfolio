<section class="process">
    <header class="process-heading">
        <span class="eyebrow">Как работим заедно</span>

        <h2>От първото съобщение<br>до готовите снимки</h2>

        <p class="process-lead measure">Няма формуляри, няма чакане с дни и няма изненади накрая. Ето какво следва, ако решите да ми пишете.</p>
    </header>

    <ol class="steps">
        @for (step of steps; track step.title) {
            <li class="step">
                <span class="step-index" aria-hidden="true">{{ '0' + ($index + 1) }}</span>

                <h3>{{ step.title }}</h3>

                <p>{{ step.text }}</p>
            </li>
        }
    </ol>
</section>
