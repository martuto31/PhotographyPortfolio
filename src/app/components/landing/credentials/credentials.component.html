<section class="creds" aria-label="Накратко">
    <dl class="creds-list">
        @for (item of credentials; track item.label) {
            <div class="cred">
                <dt class="cred-value">{{ item.value }}</dt>
                <dd class="cred-label">{{ item.label }}</dd>
            </div>
        }

        <div class="cred cred-area">
            <dt class="cred-value cred-value-text">София &amp; Видин</dt>
            <dd class="cred-label">и цяла България</dd>
        </div>
    </dl>
</section>
