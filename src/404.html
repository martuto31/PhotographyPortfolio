<!doctype html>
<html lang="bg">

<head>
    <meta charset="utf-8">
    <title>Страницата не е намерена | Виктория Борисова - phbyviki</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Страницата не е намерена. Върнете се към phbyviki.com - сватбен и събитиен фотограф София и Видин.">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
    <meta name="theme-color" content="#191817">

    <!-- Standalone page: Firebase Hosting serves this with a real HTTP 404 for paths that
         match no rewrite, so it cannot rely on the hashed Angular stylesheet. -->
    <style>
        /* Mirrors src/app/styles/variables.css. Duplicated because this page
           cannot load the hashed Angular stylesheet — keep the two in step. */
        :root {
            --paper: #FBFAF7;
            --brass: #A8721F;
            --ink: #191817;
            --font-medium-emphasis: #6B645C;
            --font-high-emphasis: #191817;
            --font-white: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 24px;
            text-align: center;
            background-color: var(--paper);
            color: var(--font-high-emphasis);
            font-family: 'Overpass', system-ui, -apple-system, sans-serif;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--font-medium-emphasis);
            margin: 0;
        }

        h1 {
            font-family: 'Cormorant', Georgia, serif;
            font-weight: 500;
            font-size: clamp(36px, 5vw, 60px);
            line-height: 1.1;
            margin: 0;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: var(--font-medium-emphasis);
            margin: 0;
            max-width: 52ch;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 26px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--font-white);
            background-color: var(--ink);
            transition: background-color 200ms ease;
        }

        a:hover { background-color: var(--brass); }

        .links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .links .ghost {
            color: var(--font-high-emphasis);
            background-color: transparent;
            border: 1px solid #D3C9B8;
        }

        .links .ghost:hover {
            color: var(--font-white);
            background-color: var(--ink);
            border-color: var(--ink);
        }
    </style>
</head>

<body>
    <p class="eyebrow">Грешка 404</p>

    <h1>Страницата не е намерена</h1>

    <p>
        Изглежда, че страницата, която търсите, е преместена или вече не съществува.
        Разгледайте галериите или ми пишете.
    </p>

    <div class="links">
        <a href="/">Към началото</a>
        <a class="ghost" href="/galerii">Галерия</a>
        <a class="ghost" href="/kontakti">Контакти</a>
    </div>
</body>

</html>
