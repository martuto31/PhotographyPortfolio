<!doctype html>
<html lang="bg">

<head>
    <meta charset="utf-8">
    <title>Страницата не е намерена | Виктория Борисова — phbyviki</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Страницата не е намерена. Върнете се към phbyviki.com — сватбен и събитиен фотограф София и Видин.">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.webp">

    <!-- Standalone page: Firebase Hosting serves this with a real HTTP 404 for paths that
         match no rewrite, so it cannot rely on the hashed Angular stylesheet. -->
    <style>
        :root {
            --bg-white: #FFFFFF;
            --primary-brand: #FD574E;
            --primary-brand-dark: #D8443C;
            --font-medium-emphasis: #6F6F6F;
            --font-high-emphasis: #1A1A1A;
            --font-white: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 24px;
            text-align: center;
            background-color: var(--bg-white);
            color: var(--font-high-emphasis);
            font-family: 'Overpass', system-ui, -apple-system, sans-serif;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--font-medium-emphasis);
            margin: 0;
        }

        h1 {
            font-family: 'Cormorant', Georgia, serif;
            font-weight: 500;
            font-size: clamp(36px, 5vw, 60px);
            line-height: 1.1;
            margin: 0;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: var(--font-medium-emphasis);
            margin: 0;
            max-width: 52ch;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 26px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--font-white);
            background-color: var(--primary-brand);
            transition: background-color 200ms ease;
        }

        a:hover { background-color: var(--primary-brand-dark); }
    </style>
</head>

<body>
    <p class="eyebrow">Грешка 404</p>

    <h1>Страницата не е намерена</h1>

    <p>
        Изглежда, че страницата, която търсите, е преместена или вече не съществува.
        Разгледайте галериите или се свържете с мен директно.
    </p>

    <a href="/">Към началото</a>
</body>

</html>
